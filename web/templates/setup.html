{% extends "base.html" %}
{% block title %}Настройка — TikTok Uploader{% endblock %}

{% block head %}
<style>
  .auth-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 56px);
    padding: 24px;
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
  }
  .auth-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
  }
  .auth-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 28px;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">Первоначальная настройка</div>
    <div class="auth-subtitle">Создайте учётную запись администратора</div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="text" id="password" name="password" required autocomplete="new-password"
               style="-webkit-text-security: disc;" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:8px;">
        Создать аккаунт
      </button>
    </form>
  </div>
</div>
{% endblock %}
