<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TikTok Uploader{% endblock %}</title>
  <style>
    /* ------------------------------------------------------------------ */
    /* Reset & base                                                         */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #121212;
      --surface:   #1e1e1e;
      --surface2:  #2a2a2a;
      --border:    #333333;
      --accent:    #fe2c55;
      --accent-h:  #ff4d6d;
      --text:      #f0f0f0;
      --text-muted:#9e9e9e;
      --green:     #4caf50;
      --yellow:    #ffc107;
      --blue:      #2196f3;
      --red:       #f44336;
      --radius:    10px;
      --font:      -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-h); text-decoration: underline; }

    /* ------------------------------------------------------------------ */
    /* Layout                                                               */
    /* ------------------------------------------------------------------ */
    .layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ------------------------------------------------------------------ */
    /* Nav                                                                  */
    /* ------------------------------------------------------------------ */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      height: 56px;
      gap: 32px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .nav-logo span { color: var(--text); }

    nav ul {
      list-style: none;
      display: flex;
      gap: 4px;
    }

    nav ul li a {
      display: block;
      padding: 6px 14px;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 14px;
      transition: background 0.15s, color 0.15s;
    }

    nav ul li a:hover,
    nav ul li a.active {
      background: var(--surface2);
      color: var(--text);
      text-decoration: none;
    }

    /* ------------------------------------------------------------------ */
    /* Main content                                                         */
    /* ------------------------------------------------------------------ */
    main {
      flex: 1;
      padding: 32px 24px;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
    }

    /* ------------------------------------------------------------------ */
    /* Card                                                                 */
    /* ------------------------------------------------------------------ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text);
    }

    /* ------------------------------------------------------------------ */
    /* Buttons                                                              */
    /* ------------------------------------------------------------------ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-h); }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #383838; }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ------------------------------------------------------------------ */
    /* Form elements                                                        */
    /* ------------------------------------------------------------------ */
    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      padding: 10px 14px;
      transition: border-color 0.15s;
      outline: none;
      resize: vertical;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--accent);
    }

    /* ------------------------------------------------------------------ */
    /* Status badges                                                        */
    /* ------------------------------------------------------------------ */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-IN_QUEUE    { background: rgba(255,193,7,0.15);  color: var(--yellow); }
    .badge-IN_PROGRESS { background: rgba(33,150,243,0.15); color: var(--blue);   }
    .badge-SUCCESS     { background: rgba(76,175,80,0.15);  color: var(--green);  }
    .badge-FAIL        { background: rgba(244,67,54,0.15);  color: var(--red);    }

    /* ------------------------------------------------------------------ */
    /* Alert / notice                                                       */
    /* ------------------------------------------------------------------ */
    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .alert-success { background: rgba(76,175,80,0.12);  color: #81c784; border: 1px solid rgba(76,175,80,0.25); }
    .alert-error   { background: rgba(244,67,54,0.12);  color: #e57373; border: 1px solid rgba(244,67,54,0.25); }
    .alert-info    { background: rgba(33,150,243,0.12); color: #64b5f6; border: 1px solid rgba(33,150,243,0.25); }

    /* ------------------------------------------------------------------ */
    /* Table                                                                */
    /* ------------------------------------------------------------------ */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: rgba(255,255,255,0.02); }

    /* ------------------------------------------------------------------ */
    /* Dot indicator                                                        */
    /* ------------------------------------------------------------------ */
    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .dot-green  { background: var(--green);  box-shadow: 0 0 6px var(--green); }
    .dot-red    { background: var(--red);    box-shadow: 0 0 6px var(--red); }
    .dot-yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }

  </style>
  {% block head %}{% endblock %}
</head>
<body>
<div class="layout">
  <nav>
    <div class="nav-logo">TikTok<span>Uploader</span></div>
    <ul>
      <li><a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}class="active"{% endif %}>Дашборд</a></li>
      <li><a href="{{ url_for('upload') }}" {% if request.endpoint == 'upload' %}class="active"{% endif %}>Загрузить</a></li>
      <li><a href="{{ url_for('accounts') }}" {% if request.endpoint == 'accounts' %}class="active"{% endif %}>Аккаунты</a></li>
      {% if debug_mode %}
      <li><a href="{{ url_for('vnc') }}" {% if request.endpoint == 'vnc' %}class="active"{% endif %}>VNC</a></li>
      {% endif %}
    </ul>
    {% if admin_user %}
    <div style="margin-left:auto; display:flex; align-items:center; gap:12px;">
      <span style="font-size:13px; color:var(--text-muted);">{{ admin_user }}</span>
      <a href="{{ url_for('logout') }}" style="font-size:13px; color:var(--text-muted);">Выйти</a>
    </div>
    {% endif %}
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

</div>
{% block scripts %}{% endblock %}
</body>
</html>
